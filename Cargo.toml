[package]
name = "grav1an"
version = "0.1.0"
edition = "2021"

[dependencies]
av-metrics-decoders = { version = "0.3.1", default-features = false, features = ["vapoursynth"] }
base16ct = "0.2.0"
chrono = "0.4.38"
clap = { version = "4.5.16", features = ["color", "derive", "wrap_help"] }
crossterm = "0.28.1"
fancy-regex = "0.13.0"
futures = { version = "0.3.30", features = ["futures-executor"] }
humansize = "2.1.3"
indicatif = "0.17.8"
isolang = "2.4.0"
itertools = "0.13.0"
lava_torrent = "0.11.1"
md5 = "0.7.0"
mediainfo = "0.2.0"
open = "5.3.0"
phf = { version = "0.11.2", features = ["serde", "macros"] }
polyfit-rs = "0.2.1"
polynomial = "0.2.6"
rand = "0.8.5"
# if reqwest isnt the same version as tvdb4, there will be a compile error in src/tvdb4.rs
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.208", features = ["derive", "serde_derive"] }
serde_json = { version = "1.0.125", features = ["std", "alloc", "preserve_order", "raw_value"] }
ssimulacra2 = { version = "0.5.0", default-features = false }
statrs = "0.17.1"
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread"] }
tvdb4 = "0.1.0"
vapoursynth = { version = "0.4.0", default-features = false, features = ["vapoursynth-api-36", "vapoursynth-functions", "vsscript-api-32", "vsscript-functions"] }
which = "6.0.3"
